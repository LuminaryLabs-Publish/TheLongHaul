name: Illustrated portrait acceptance
on:
  push:
    branches: ['validation/illustrated-highway-20261103']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: illustrated-highway-${{ github.ref }}
  cancel-in-progress: true
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact portrait-only layout repair
        if: hashFiles('.agent/portrait-fix.json') != ''
        run: |
          test "$GITHUB_REF" = refs/heads/validation/illustrated-highway-20261103
          python3 - <<'PY'
          import pathlib,json,hashlib
          instruction=pathlib.Path('.agent/portrait-fix.json'); data=json.loads(instruction.read_text())
          assert data['schema']==1 and {x['path'] for x in data['changes']}=={'styles.css','tools/validate-visuals.mjs'}
          for fix in data['changes']:
              target=pathlib.Path(fix['path']);text=target.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==fix['before']
              for change in fix['replacements']:
                  assert text.count(change['old'])==1
                  text=text.replace(change['old'],change['new'])
              assert hashlib.sha256(text.encode()).hexdigest()==fix['after']
              target.write_text(text)
          instruction.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css tools/validate-visuals.mjs .agent/portrait-fix.json
          git commit -m 'Keep portrait cargo deadline above warnings and reserve touch space only where needed'
          git push origin HEAD:refs/heads/validation/illustrated-highway-20261103
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:host
      - run: git diff --exit-code -- src vendor index.html campaign.html styles.css
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Actual rendered world and expanded portrait layout acceptance
        run: node tools/validate-visuals.mjs --output=.cache/visual-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: illustrated-final-layout
          include-hidden-files: true
          path: .cache/visual-validation/
          retention-days: 14
