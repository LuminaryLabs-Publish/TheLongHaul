name: Illustrated highway acceptance
on:
  push:
    branches: ['validation/illustrated-highway-20261103']
  workflow_dispatch:
concurrency:
  group: illustrated-highway-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact inspected repairs on validation branch
        run: |
          test "${GITHUB_REF}" = refs/heads/validation/illustrated-highway-20261103
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil,zlib
          root=pathlib.Path.cwd().resolve(); stage=root/'.agent/visual-repair'
          raw=b''.join((stage/f'{i}.part').read_bytes() for i in range(4))
          assert hashlib.sha256(raw).hexdigest()=='b14460cf9e0dd8ea7b712277c15c2f796b8ec27b038baa41097dd8ea86df2fc0'
          data=json.loads(zlib.decompress(raw)); assert data['schema']==1
          assert data['base']=='09f0ffb06cdc73571aaeb3626870ed3bc98962dd'
          seen=set()
          for item in data['changes']:
              rel=pathlib.PurePosixPath(item['path'])
              assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
              assert rel.parts[0] in ('src','tools','tests','styles.css','package.json') and str(rel) not in seen
              seen.add(str(rel)); target=(root/rel).resolve(); assert target.is_relative_to(root)
              old=target.read_text() if target.exists() else ''
              if item['before'] is None: assert not target.exists()
              else: assert hashlib.sha256(old.encode()).hexdigest()==item['before'],str(rel)
              result=old
              for start,end,text in reversed(item['edits']):
                  assert 0<=start<=end<=len(old)
                  result=result[:start]+text+result[end:]
              assert hashlib.sha256(result.encode()).hexdigest()==item['after'],str(rel)
              target.parent.mkdir(parents=True,exist_ok=True);target.write_text(result)
          (root/'.github/workflows/illustrated-acceptance.yml').write_text(data['finalWorkflow'])
          shutil.rmtree(stage)
          print('Exact verified repairs:',len(seen))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair rendered road subgrade, portrait HUD, cloud silhouettes and acceptance failure propagation'
          git push origin HEAD:refs/heads/validation/illustrated-highway-20261103
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:host
      - name: Lock candidate source
        id: candidate
        run: |
          git diff --exit-code -- src vendor index.html campaign.html styles.css
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p .cache/acceptance
          git rev-parse HEAD > .cache/acceptance/revision.txt
      - name: Deterministic regression suites
        run: npm test 2>&1 | tee .cache/acceptance/tests.log
      - name: Full engine six-hundred-second road traversal
        run: npm run test:roads:traverse 2>&1 | tee .cache/acceptance/road-traversal.log
      - name: Install actual browser
        run: npx playwright install --with-deps chromium
      - name: Render and inspect actual game contracts
        run: |
          npm run validate:visuals -- --output=.cache/visual-validation 2>&1 | tee .cache/acceptance/browser.log
          node -e "if(require('./.cache/visual-validation/report.json').verdict!=='PASS')process.exit(1)"
      - name: Retain browser evidence before further checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illustrated-browser-evidence
          include-hidden-files: true
          path: |
            .cache/acceptance/
            .cache/visual-validation/
          retention-days: 14
      - name: Preserve skills, abilities and persistence
        run: node tools/validate-skills.mjs --output=.cache/skills-regression
      - name: Retain skill regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illustrated-skills-regression
          include-hidden-files: true
          path: .cache/skills-regression/
          retention-days: 14
  film:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.candidate }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install media tools
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Continuous gameplay and sixty-second edit
        run: |
          mkdir -p .cache/visual-film
          npm run record:visuals -- --output=.cache/visual-film 2>&1 | tee .cache/visual-film/capture.log
          node -e "if(require('./.cache/visual-film/report.json').verdict!=='PASS')process.exit(1)"
      - name: Retain film and complete run provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illustrated-gameplay-film
          include-hidden-files: true
          path: .cache/visual-film/
          retention-days: 14
