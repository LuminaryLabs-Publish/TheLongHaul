name: Illustrated skill acceptance
on:
  push:
    branches: ['validation/illustrated-highway-20261103']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: illustrated-highway-${{ github.ref }}
  cancel-in-progress: true
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ground test fixtures on the actual road window
        if: hashFiles('.agent/skill-ground-fix.json') != ''
        run: |
          test "$GITHUB_REF" = refs/heads/validation/illustrated-highway-20261103
          python3 - <<'PY'
          import pathlib,json,hashlib
          instruction=pathlib.Path('.agent/skill-ground-fix.json');fix=json.loads(instruction.read_text())
          assert fix['schema']==1 and fix['path']=='tools/validate-skills.mjs'
          target=pathlib.Path(fix['path']);text=target.read_text()
          assert hashlib.sha256(text.encode()).hexdigest()==fix['before']
          for change in fix['replacements']:
              assert text.count(change['old'])==1
              text=text.replace(change['old'],change['new'])
          assert hashlib.sha256(text.encode()).hexdigest()==fix['after']
          target.write_text(text);instruction.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validate-skills.mjs .agent/skill-ground-fix.json
          git commit -m 'Ground browser fixtures using the correct modular road window before ability activation'
          git push origin HEAD:refs/heads/validation/illustrated-highway-20261103
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:host
      - run: git diff --exit-code -- src vendor index.html campaign.html styles.css
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Existing skill, ability, storage and input contracts
        run: node tools/validate-skills.mjs --output=.cache/skills-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: illustrated-skills-regression
          include-hidden-files: true
          path: .cache/skills-regression/
          retention-days: 14
