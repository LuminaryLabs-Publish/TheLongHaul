name: Illustrated highway acceptance
on:
  push:
    branches: ['validation/illustrated-highway-20261103']
  workflow_dispatch:
concurrency:
  group: illustrated-highway-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:host
      - name: Lock candidate source
        id: candidate
        run: |
          git diff --exit-code -- src vendor index.html campaign.html styles.css
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p .cache/acceptance
          git rev-parse HEAD > .cache/acceptance/revision.txt
      - name: Deterministic regression suites
        run: npm test 2>&1 | tee .cache/acceptance/tests.log
      - name: Full engine six-hundred-second road traversal
        run: npm run test:roads:traverse 2>&1 | tee .cache/acceptance/road-traversal.log
      - name: Install actual browser
        run: npx playwright install --with-deps chromium
      - name: Render and inspect actual game contracts
        run: npm run validate:visuals -- --output=.cache/visual-validation 2>&1 | tee .cache/acceptance/browser.log
      - name: Retain browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illustrated-browser-evidence
          include-hidden-files: true
          path: |
            .cache/acceptance/
            .cache/visual-validation/
          retention-days: 14
  film:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.candidate }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install media tools
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Continuous gameplay and sixty-second edit
        run: |
          mkdir -p .cache/visual-film
          npm run record:visuals -- --output=.cache/visual-film 2>&1 | tee .cache/visual-film/capture.log
      - name: Retain film and complete run provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: illustrated-gameplay-film
          include-hidden-files: true
          path: .cache/visual-film/
          retention-days: 14
