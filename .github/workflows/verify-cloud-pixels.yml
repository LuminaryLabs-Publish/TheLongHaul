name: Verify cloud pixels
on:
  push:
    branches: [main]
    paths:
      - 'src/app/visual-presentation.js'
      - 'src/game/landscape-style.mjs'
      - 'tools/validate-visuals.mjs'
      - 'tests/presentation-regression.mjs'
      - '.github/workflows/verify-cloud-pixels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clouds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/presentation-regression.mjs
      - run: npm run validate:visuals
      - name: Upload cloud validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-visual-validation
          path: .cache/visual-validation
          if-no-files-found: ignore
